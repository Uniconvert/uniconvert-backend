  /users/me:
    get:
      tags:
        - User & Onboarding
      summary: 내 정보 조회 | 텐텐
      description: |
        [변경 필요]
        - Figma 설정 화면에는 이메일("Hamester@gmail.com")과 프로필 이미지 업로드 UI가 표시됩니다.
          기존 문서 응답(userId, nickname, homeCurrency, isOnboardingCompleted)에는 없는
          email, imageUrl 필드 추가가 필요합니다. (User 엔티티에는 이미 email, imageUrl 컬럼 존재)
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserMeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags:
        - User & Onboarding
      summary: 내 정보 수정 (설정) | 텐텐
      description: |
        [확인 필요]
        - Figma 설정 화면에서 timezone을 수정하는 UI를 이번 분석 범위에서 확인하지 못했습니다.
          온보딩에서만 설정하고 이후 변경 불가인지 확인 필요.
        - 홈 통화 변경 시 기존 지출 재계산 여부는 프론트 확인 팝업 후 요청(기존 문서 메모 유지).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nickname:
                  type: string
                  nullable: true
                homeCurrency:
                  type: string
                  nullable: true
                localCurrencies:
                  type: array
                  nullable: true
                  items:
                    type: string
                timezone:
                  type: string
                  nullable: true
                  description: '[확인 필요] 설정 화면에서 실제로 수정 가능한지 미확인'
      responses:
        '200':
          description: 수정 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserMeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /onboarding/complete:
    post:
      tags:
        - User & Onboarding
      summary: 온보딩 완료 (통화·예산·메인 지갑 일괄 저장) | 텐텐
      description: |
        [추가 필요]
        - Figma "프로필 설정" 화면에는 "내가 가장 관리하고 싶은 목표는 무엇인가요? (복수 선택 가능)"
          라는 질문과 "여행/취미", "저축", "학업비" 선택지가 있습니다. 기존 요청 필드에는
          이 목표(goal) 값을 저장할 필드가 없습니다.
        - 프로필 이미지 업로드 UI("이미지 업로드" 버튼)가 프로필 설정 화면에 있으나 요청 필드에 없음.

        [확인 필요]
        - monthlyBudgetHome, mainWalletInitialBalance를 입력받는 화면을 이번 Figma 분석 범위에서
          명확히 특정하지 못했습니다. 별도 스텝인지, 다른 값으로 대체되었는지 확인 필요.
        - 서비스 약관 동의 날짜를 정확히 기록해야 한다는 담당자 메모(P0 v3 문서 내)가 있어
          TermsAgreement.agreedAt 저장 시점을 온보딩 완료 시점과 맞출지 별도 스텝(회원가입 시)으로
          할지 확인 필요.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nickname
                - homeCurrency
                - localCurrencies
                - timezone
              properties:
                nickname:
                  type: string
                homeCurrency:
                  type: string
                localCurrencies:
                  type: array
                  items:
                    type: string
                timezone:
                  type: string
                monthlyBudgetHome:
                  type: number
                  nullable: true
                  description: '[확인 필요] 입력 화면 미특정'
                mainWalletInitialBalance:
                  type: number
                  nullable: true
                  description: '[확인 필요] 입력 화면 미특정'
                goals:
                  type: array
                  nullable: true
                  description: '[추가 필요] Figma 프로필 설정 화면의 목표(복수 선택) 값'
                  items:
                    type: string
                    example: TRAVEL_HOBBY
                profileImageUrl:
                  type: string
                  nullable: true
                  description: '[추가 필요] Figma 프로필 이미지 업로드 UI에 대응하는 필드'
      responses:
        '200':
          description: 온보딩 완료
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          mainWalletId:
                            type: integer
                            format: int64
                          budgetId:
                            type: integer
                            format: int64
                          isOnboardingCompleted:
                            type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
  /currencies:
    get:
      tags:
        - Reference & Budget
      summary: 지원 통화 목록 조회 | 텐텐
      description: |
        [확인 필요]
        - Figma 환율 계산기 화면에는 GBP(£)도 등장합니다. 기존 문서 예시에는 5개 통화만
          언급되어 있어, 지원 통화 목록에 GBP를 포함해야 하는지 확인이 필요합니다.
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/CurrencyResponse'
  /categories:
    get:
      tags:
        - Reference & Budget
      summary: 기본 지출 카테고리 목록 조회 | 소온
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/CategoryResponse'
  /budgets/{yearMonth}:
    get:
      tags:
        - Reference & Budget
      summary: 월 예산 조회 | 소온
      parameters:
        - name: yearMonth
          in: path
          required: true
          schema:
            type: string
            example: 2026-07
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/BudgetResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - Reference & Budget
      summary: 월 예산 생성·수정 (upsert) | 소온
      description: |
        [확인 필요]
        - 온보딩 단계 외에 예산을 수정하는 화면을 이번 Figma 분석 범위에서 명확히 확인하지
          못했습니다. 설정 화면 또는 별도 화면 존재 여부 확인 필요.
      parameters:
        - name: yearMonth
          in: path
          required: true
          schema:
            type: string
            example: 2026-07
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - monthlyLimitHome
              properties:
                monthlyLimitHome:
                  type: number
      responses:
        '200':
          description: 저장 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/BudgetResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /main-wallet:
    get:
      tags:
        - Wallet & Pot
      summary: 메인 지갑 잔액 조회 | 텐텐
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MainWalletResponse'
  /main-wallet/transactions:
    post:
      tags:
        - Wallet & Pot
      summary: 메인 지갑 입금·수동 잔액 조정 | 텐텐
      description: |
        [변경 필요]
        - 기존 문서에는 type 값으로 DEPOSIT, MANUAL_SET만 언급되어 있으나, 실제 코드의
          MainWalletTransactionType enum에는 TRANSFER_OUT 값이 이미 정의되어 있습니다.
          지갑 간 이체(WalletTransfer 엔티티도 이미 존재) 기능과 연동되는 것으로 보이나,
          기존 문서는 지갑 이체 API 자체를 "지갑 세부 기능 제외"로 스코프아웃했습니다.
          enum 값과 스코프를 맞출지 확인이 필요합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - type
                - amount
              properties:
                type:
                  $ref: '#/components/schemas/MainWalletTransactionType'
                amount:
                  type: number
                memo:
                  type: string
                  nullable: true
      responses:
        '200':
          description: 처리 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          mainWalletTransactionId:
                            type: integer
                            format: int64
                          currentBalance:
                            type: number
        '400':
          $ref: '#/components/responses/BadRequest'
  /sub-wallets:
    get:
      tags:
        - Wallet & Pot
      summary: 서브 지갑(Pot) 목록 조회 | 텐텐
      description: |
        [변경 필요]
        - Figma "Pots" 화면은 각 Pot마다 목표 금액, 현재 모인 금액, 진행률(%), 대표 이미지/아이콘을
          카드 형태로 보여줍니다. 기존 응답 필드(subWalletId, walletType, name, currency,
          currentBalance, isLocked)에는 목표 저축 관련 필드가 전혀 없습니다.
        - Figma 화면 상단에는 "Pots에 배정된 금액", "사용 가능 금액" 같은 집계 값도 표시되므로
          목록 API 응답에 요약(summary) 블록 추가가 필요합니다.

        [추가 필요]
        - targetAmount(목표 금액), currentSavedAmount 또는 progressPercent, iconKey/imageUrl
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          summary:
                            type: object
                            description: '[추가 필요] Figma Pots 화면 상단 요약 영역'
                            properties:
                              monthlyBudgetHome:
                                type: number
                              potsAllocatedAmountHome:
                                type: number
                              availableAmountHome:
                                type: number
                          subWallets:
                            type: array
                            items:
                              $ref: '#/components/schemas/SubWalletResponse'
    post:
      tags:
        - Wallet & Pot
      summary: 서브 지갑(Pot) 생성 | 텐텐
      description: |
        [변경 필요]
        - Figma "Pots_새로 만들기" 화면 필드: "Pots 이름", "목표 금액", "대표 카테고리",
          "대표 이미지"(이모티콘 선택 또는 직접 업로드) — 기존 요청 필드(walletType, name,
          currency, currentBalance, categoryId, isLocked)와 다릅니다. currency 입력 UI는
          이 화면에서 확인되지 않았습니다.

        [확인 필요]
        - Pot 생성 시 currency를 사용자가 직접 지정하는지, 홈 통화로 고정되는지
        - "직접 업로드" 이미지의 저장 방식(별도 파일 업로드 API 필요 여부)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
