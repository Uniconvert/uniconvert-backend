      summary: Access Token 재발급 | 텐텐
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: 재발급 성공
          content:
            application/json:
              schema:
                allOf:
