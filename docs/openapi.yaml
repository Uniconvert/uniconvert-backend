  - name: Dashboard & Report
    description: 홈 대시보드, 리포트
paths:
  /auth/local/sign-up:
    post:
      tags:
        - Auth
      summary: 자체 회원가입 | 텐텐
      description: |
        [확인 필요]
        - Figma에는 약관 동의가 "약관동의" 화면으로 별도 분리되어 있습니다. 약관 동의 데이터가
          이 API 요청(terms 배열)에 함께 전달되는지, 아니면 별도 API/스텝으로 저장되는지 확정 필요.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - terms
              properties:
                email:
                  type: string
                  format: email
                  description: 로그인 이메일
                password:
                  type: string
                  format: password
                  description: 영문·숫자·특수문자 포함
                terms:
                  type: array
                  description: 약관 동의 목록. SERVICE, PRIVACY는 필수 동의.
                  items:
                    type: object
                    required:
                      - termsType
                      - isAgreed
                    properties:
                      termsType:
                        $ref: '#/components/schemas/TermsType'
                      termsVersion:
                        type: string
                        nullable: true
                      isAgreed:
                        type: boolean
      responses:
        '200':
          description: 회원가입 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          userId:
                            type: integer
                            format: int64
                            description: 생성된 회원 ID
                          accessToken:
                            type: string
                          refreshToken:
                            type: string
                          isOnboardingCompleted:
                            type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
