openapi: 3.0.3

# ============================================================================
# Uniconvert API — draft OpenAPI specification (SOURCE / split version)
#
# 이 디렉터리(docs/openapi/)가 편집용 원본입니다. 도메인별 파일로 나뉘어 있어
# 팀원별로 다른 파일을 건드릴 때 병합 충돌 위험이 낮습니다.
#
#   docs/openapi/
#   ├── openapi.yaml            (이 파일: info/servers/tags/security + paths·components 참조)
#   ├── paths/
#   │   ├── auth.yaml
#   │   ├── user-onboarding.yaml
#   │   ├── reference-budget.yaml
#   │   ├── wallet-pot.yaml
#   │   ├── exchange-rate.yaml
#   │   ├── expense.yaml
#   │   └── dashboard-report.yaml
#   └── components/
#       ├── parameters.yaml
#       ├── responses.yaml
#       └── schemas.yaml
#
# 실제로 보거나 배포할 때 쓰는 단일 파일은 src/main/resources/static/docs/openapi.yaml
# 이며(Swagger 문서 병합에 사용되도록 static 리소스로 포함), 아래 명령으로 이 디렉터리에서
# 번들링해서 생성합니다. 번들 파일을 직접 수정하지 말고, 반드시 이 디렉터리의 파일을
# 수정한 뒤 재생성하세요.
#
#   npx -y @redocly/cli bundle docs/openapi/openapi.yaml -o src/main/resources/static/docs/openapi.yaml
#
# ============================================================================

info:
  title: Uniconvert API
  version: v1
  description: |
    Uniconvert backend API documentation (draft).
  contact:
    name: Uniconvert

servers:
  - url: /

tags:
  - name: Auth
    description: 인증·JWT (회원가입/로그인/이메일 인증/토큰 재발급)
  - name: User & Onboarding
    description: 내 정보, 온보딩, 설정
  - name: Reference & Budget
    description: 통화·카테고리 기준 데이터, 월 예산
  - name: Wallet & Pot
    description: 메인 지갑, 서브 지갑(Pot)
  - name: Exchange Rate
    description: 환율 조회 및 계산기
  - name: Expense
    description: 지출 등록·조회·수정·삭제, 영수증/명세서 업로드
  - name: Dashboard & Report
    description: 홈 대시보드, 리포트

security:
  - bearerAuth: []

paths:
  # Auth
  /auth/local/sign-up:
    $ref: './paths/auth.yaml#/sign-up'
  /auth/local/login:
    $ref: './paths/auth.yaml#/login'
  /auth/social/login:
    $ref: './paths/auth.yaml#/social-login'
  /auth/email-verifications:
    $ref: './paths/auth.yaml#/email-verifications'
  /auth/email-verifications/confirm:
    $ref: './paths/auth.yaml#/email-verifications-confirm'
  /auth/token/reissue:
    $ref: './paths/auth.yaml#/token-reissue'

  # User & Onboarding
  /users/me:
    $ref: './paths/user-onboarding.yaml#/users-me'
  /onboarding/complete:
    $ref: './paths/user-onboarding.yaml#/onboarding-complete'

  # Reference & Budget
  /currencies:
    $ref: './paths/reference-budget.yaml#/currencies'
  /categories:
    $ref: './paths/reference-budget.yaml#/categories'
  /budgets/{yearMonth}:
    $ref: './paths/reference-budget.yaml#/budgets-year-month'

  # Wallet & Pot
  /main-wallet:
    $ref: './paths/wallet-pot.yaml#/main-wallet'
  /main-wallet/transactions:
    $ref: './paths/wallet-pot.yaml#/main-wallet-transactions'
  /sub-wallets:
    $ref: './paths/wallet-pot.yaml#/sub-wallets'
  /sub-wallets/{subWalletId}:
    $ref: './paths/wallet-pot.yaml#/sub-wallet-detail'
  /sub-wallets/{subWalletId}/deposits:
    $ref: './paths/wallet-pot.yaml#/sub-wallet-deposits'

  # Exchange Rate
  /exchange-rates/current:
    $ref: './paths/exchange-rate.yaml#/current'
  /exchange-rates/quote:
    $ref: './paths/exchange-rate.yaml#/quote'

  # Expense
  /expenses:
    $ref: './paths/expense.yaml#/expenses'
  /expenses/{expenseId}:
    $ref: './paths/expense.yaml#/expense-detail'
  /expenses/import:
    $ref: './paths/expense.yaml#/import'
  /merchant-category-preferences/suggest:
    $ref: './paths/expense.yaml#/merchant-category-suggest'

  # Dashboard & Report
  /dashboard:
    $ref: './paths/dashboard-report.yaml#/dashboard'
  /reports/monthly:
    $ref: './paths/dashboard-report.yaml#/monthly'
  /reports/monthly/email:
    $ref: './paths/dashboard-report.yaml#/monthly-email'
  /reports/categories:
    $ref: './paths/dashboard-report.yaml#/categories'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    BrowserLanguageHeader:
      $ref: './components/parameters.yaml#/BrowserLanguageHeader'

  responses:
    BadRequest:
      $ref: './components/responses.yaml#/BadRequest'
    Unauthorized:
      $ref: './components/responses.yaml#/Unauthorized'
    Forbidden:
      $ref: './components/responses.yaml#/Forbidden'
    NotFound:
      $ref: './components/responses.yaml#/NotFound'
    Conflict:
      $ref: './components/responses.yaml#/Conflict'
    InsufficientBalance:
      $ref: './components/responses.yaml#/InsufficientBalance'

  schemas:
    ApiResponse:
      $ref: './components/schemas.yaml#/ApiResponse'
    PageResponse:
      $ref: './components/schemas.yaml#/PageResponse'
    TermsType:
      $ref: './components/schemas.yaml#/TermsType'
    AuthProvider:
      $ref: './components/schemas.yaml#/AuthProvider'
    WalletType:
      $ref: './components/schemas.yaml#/WalletType'
    MainWalletTransactionType:
      $ref: './components/schemas.yaml#/MainWalletTransactionType'
    ExpenseRateMode:
      $ref: './components/schemas.yaml#/ExpenseRateMode'
    RateUpdateMode:
      $ref: './components/schemas.yaml#/RateUpdateMode'
    DailyRateStatus:
      $ref: './components/schemas.yaml#/DailyRateStatus'
    UserMeResponse:
      $ref: './components/schemas.yaml#/UserMeResponse'
    CurrencyResponse:
      $ref: './components/schemas.yaml#/CurrencyResponse'
    CategoryResponse:
      $ref: './components/schemas.yaml#/CategoryResponse'
    BudgetResponse:
      $ref: './components/schemas.yaml#/BudgetResponse'
    MainWalletResponse:
      $ref: './components/schemas.yaml#/MainWalletResponse'
    SubWalletResponse:
      $ref: './components/schemas.yaml#/SubWalletResponse'
    CurrentExchangeRateResponse:
      $ref: './components/schemas.yaml#/CurrentExchangeRateResponse'
    ExchangeQuoteResponse:
      $ref: './components/schemas.yaml#/ExchangeQuoteResponse'
    ExpenseSummaryResponse:
      $ref: './components/schemas.yaml#/ExpenseSummaryResponse'
    ExpenseDetailResponse:
      $ref: './components/schemas.yaml#/ExpenseDetailResponse'
    ExpenseImportResponse:
      $ref: './components/schemas.yaml#/ExpenseImportResponse'
    ExpenseImportErrorDetail:
      $ref: './components/schemas.yaml#/ExpenseImportErrorDetail'
    DashboardResponse:
      $ref: './components/schemas.yaml#/DashboardResponse'
    MonthlyReportResponse:
      $ref: './components/schemas.yaml#/MonthlyReportResponse'
    CategoryReportResponse:
      $ref: './components/schemas.yaml#/CategoryReportResponse'
