# Wallet & Pot — path definitions (split out of the bundled openapi.yaml for lower merge-conflict risk)

# Edit here, then regenerate src/main/resources/static/docs/openapi.yaml via:
# npx -y @redocly/cli bundle docs/openapi/openapi.yaml -o src/main/resources/static/docs/openapi.yaml


# ============================================================================
# Main Wallet
# ============================================================================

main-wallet:
  get:
    tags: [Wallet & Pot]
    summary: 메인 지갑 잔액 조회 | 텐텐
    responses:
      '200':
        description: 조회 성공
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas.yaml#/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '../components/schemas.yaml#/MainWalletResponse'


# ============================================================================
# Main Wallet Transactions
# ============================================================================

main-wallet-transactions:
  post:
    tags: [Wallet & Pot]
    summary: 메인 지갑 입금·수동 잔액 조정 | 텐텐
    description: |
      [변경 필요]
      - 기존 문서에는 type 값으로 DEPOSIT, MANUAL_SET만 언급되어 있으나,
        실제 코드의 MainWalletTransactionType enum에는 TRANSFER_OUT 값이 이미 정의되어 있습니다.
      - 지갑 간 이체(WalletTransfer 엔티티도 이미 존재) 기능과 연동되는 것으로 보이나,
        기존 문서는 지갑 이체 API 자체를 "지갑 세부 기능 제외"로 스코프아웃했습니다.
      - enum 값과 스코프를 맞출지 확인이 필요합니다.

    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - type
              - amount
            properties:
              type:
                $ref: '../components/schemas.yaml#/MainWalletTransactionType'

              amount:
                type: number

              memo:
                type: string
                nullable: true

    responses:
      '200':
        description: 처리 성공
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas.yaml#/ApiResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        mainWalletTransactionId:
                          type: integer
                          format: int64

                        currentBalance:
                          type: number

      '400':
        $ref: '../components/responses.yaml#/BadRequest'


# ============================================================================
# Pots
# ============================================================================

pots:
  post:
    tags: [Wallet & Pot]
    summary: Pot 생성 | 텐텐
    description: |
      새로운 목표 저축 Pot을 생성합니다.

      Pot 대표 이미지는 이미지 파일이나 URL 자체를 백엔드에 저장하지 않습니다.
      프론트에 준비된 에셋 중 사용자가 선택한 이미지의 key를
      representativeImageKey로 전달하고 백엔드는 해당 key만 저장합니다.

      입력값:
      - name: Pot 이름
      - goalCategory: 대표 목표 카테고리
      - representativeImageKey: 프론트 에셋에서 선택한 Pot 대표 이미지 key
      - targetAmount: 최종 목표 금액
      - monthlyAllocation: 매월 저축할 계획 금액
      - displayOrder: 화면에 표시할 순서

      생성 직후:
      - savedAmount는 0입니다.
      - thisMonthAmount는 0입니다.

    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - name
              - targetAmount
              - monthlyAllocation
            properties:
              name:
                type: string
                maxLength: 30
                description: Pot 이름
                example: 유럽 여행

              goalCategory:
                type: string
                nullable: true
                maxLength: 30
                description: Pot 대표 목표 카테고리
                example: TRAVEL

              representativeImageKey:
                type: string
                nullable: true
                maxLength: 100
                description: 프론트 에셋에서 선택한 Pot 대표 이미지 key
                example: pot_travel_01

              targetAmount:
                type: number
                description: 최종 목표 금액
                example: 3000000

              monthlyAllocation:
                type: number
                description: 매월 저축할 계획 금액
                example: 300000

              displayOrder:
                type: integer
                format: int64
                nullable: true
                description: Pot 화면 표시 순서
                example: 1

    responses:
      '201':
        description: Pot 생성 성공
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/PotResponse'

      '400':
        $ref: '../components/responses.yaml#/BadRequest'

      '401':
        $ref: '../components/responses.yaml#/Unauthorized'


  get:
    tags: [Wallet & Pot]
    summary: Pot 목록 조회 | 텐텐
    description: |
      로그인한 사용자의 Pot 목록을 표시 순서대로 조회합니다.

      응답 금액 필드:
      - targetAmount: 최종 목표 금액
      - savedAmount: 모든 월의 실제 누적 배정 금액
      - monthlyAllocation: 매월 저축할 계획 금액
      - thisMonthAmount: 사용자 시간대 기준 이번 달 실제 배정 금액

      대표 이미지는 representativeImageKey로 반환합니다.

      includeArchived 사용법:
      - false: 보관되지 않은 Pot만 조회
      - true: 보관된 Pot을 포함하여 전체 조회

      호출 예시:
      GET /pots?includeArchived=false

    parameters:
      - name: includeArchived
        in: query
        required: false
        description: 보관된 Pot 포함 여부
        schema:
          type: boolean
          default: false
        example: false

    responses:
      '200':
        description: Pot 목록 조회 성공
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../components/schemas.yaml#/PotResponse'

      '401':
        $ref: '../components/responses.yaml#/Unauthorized'


# ============================================================================
# Pot Detail / Update
# ============================================================================

pot-detail:
  get:
    tags: [Wallet & Pot]
    summary: Pot 상세 조회 | 텐텐
    description: |
      지정한 Pot의 상세 정보를 조회합니다.

      응답에는 다음 정보가 포함됩니다.
      - Pot 이름
      - 대표 목표 카테고리
      - representativeImageKey
      - 최종 목표 금액
      - 실제 누적 배정 금액
      - 월 저축 계획 금액
      - 이번 달 실제 배정 금액
      - 보관 여부
      - 화면 표시 순서

    parameters:
      - name: potId
        in: path
        required: true
        description: 조회할 Pot ID
        schema:
          type: integer
          format: int64
        example: 1

    responses:
      '200':
        description: Pot 상세 조회 성공
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/PotResponse'

      '401':
        $ref: '../components/responses.yaml#/Unauthorized'

      '404':
        $ref: '../components/responses.yaml#/NotFound'


  patch:
    tags: [Wallet & Pot]
    summary: Pot 수정 | 텐텐
    description: |
      지정한 Pot의 정보를 수정합니다.

      변경 가능한 값:
      - name
      - goalCategory
      - representativeImageKey
      - targetAmount
      - monthlyAllocation
      - displayOrder

      representativeImageKey는 프론트 에셋에서 선택한
      Pot 대표 이미지의 key입니다.

      요청에서 생략된 값은 기존 값을 유지합니다.

    parameters:
      - name: potId
        in: path
        required: true
        description: 수정할 Pot ID
        schema:
          type: integer
          format: int64
        example: 1

    requestBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
                nullable: true
                maxLength: 30
                description: 변경할 Pot 이름
                example: 유럽 여행 경비

              goalCategory:
                type: string
                nullable: true
                maxLength: 30
                description: 변경할 대표 목표 카테고리
                example: TRAVEL

              representativeImageKey:
                type: string
                nullable: true
                maxLength: 100
                description: 변경할 Pot 대표 이미지 key
                example: pot_travel_02

              targetAmount:
                type: number
                nullable: true
                description: 변경할 최종 목표 금액
                example: 3500000

              monthlyAllocation:
                type: number
                nullable: true
                description: 변경할 월 저축 계획 금액
                example: 350000

              displayOrder:
                type: integer
                format: int64
                nullable: true
                description: 변경할 화면 표시 순서
                example: 1

    responses:
      '200':
        description: Pot 수정 성공
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/PotResponse'

      '400':
        $ref: '../components/responses.yaml#/BadRequest'

      '401':
        $ref: '../components/responses.yaml#/Unauthorized'

      '404':
        $ref: '../components/responses.yaml#/NotFound'


# ============================================================================
# Pot Archive
# ============================================================================

pot-archive:
  patch:
    tags: [Wallet & Pot]
    summary: Pot 보관 상태 변경 | 텐텐
    description: |
      지정한 Pot의 보관 상태를 변경합니다.

      - archived=true: Pot을 보관 처리합니다.
      - archived=false: 보관된 Pot을 다시 활성화합니다.
      - 보관된 Pot은 기본 GET /pots 조회에서 제외됩니다.
      - GET /pots?includeArchived=true로 조회하면 보관된 Pot도 확인할 수 있습니다.

      이 API는 Pot을 실제 삭제하지 않습니다.
      Pot 및 월별 배정 데이터는 DB에 유지됩니다.

    parameters:
      - name: potId
        in: path
        required: true
        description: 보관 상태를 변경할 Pot ID
        schema:
          type: integer
          format: int64
        example: 1

    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - archived
            properties:
              archived:
                type: boolean
                description: Pot 보관 여부
                example: true

    responses:
      '200':
        description: Pot 보관 상태 변경 성공
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/PotResponse'

      '400':
        $ref: '../components/responses.yaml#/BadRequest'

      '401':
        $ref: '../components/responses.yaml#/Unauthorized'

      '404':
        $ref: '../components/responses.yaml#/NotFound'