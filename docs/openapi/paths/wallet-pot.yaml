# Wallet & Pot — path definitions (split out of docs/openapi.yaml for lower merge-conflict risk)
# Edit here, then regenerate docs/openapi.yaml via:
#   npx -y @redocly/cli bundle docs/openapi/openapi.yaml -o docs/openapi.yaml

main-wallet:
  get:
    tags: [Wallet & Pot]
    summary: 메인 지갑 잔액 조회 | 텐텐
    responses:
      '200':
        description: 조회 성공
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas.yaml#/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '../components/schemas.yaml#/MainWalletResponse'

main-wallet-transactions:
  post:
    tags: [Wallet & Pot]
    summary: 메인 지갑 입금·수동 잔액 조정 | 텐텐
    description: |
      [변경 필요]
      - 기존 문서에는 type 값으로 DEPOSIT, MANUAL_SET만 언급되어 있으나, 실제 코드의
        MainWalletTransactionType enum에는 TRANSFER_OUT 값이 이미 정의되어 있습니다.
        지갑 간 이체(WalletTransfer 엔티티도 이미 존재) 기능과 연동되는 것으로 보이나,
        기존 문서는 지갑 이체 API 자체를 "지갑 세부 기능 제외"로 스코프아웃했습니다.
        enum 값과 스코프를 맞출지 확인이 필요합니다.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [type, amount]
            properties:
              type:
                $ref: '../components/schemas.yaml#/MainWalletTransactionType'
              amount:
                type: number
              memo:
                type: string
                nullable: true
    responses:
      '200':
        description: 처리 성공
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas.yaml#/ApiResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        mainWalletTransactionId:
                          type: integer
                          format: int64
                        currentBalance:
                          type: number
      '400':
        $ref: '../components/responses.yaml#/BadRequest'

sub-wallets:
  get:
    tags: [Wallet & Pot]
    summary: 서브 지갑(Pot) 목록 조회 | 텐텐
    description: |
      [변경 필요]
      - Figma "Pots" 화면은 각 Pot마다 목표 금액, 현재 모인 금액, 진행률(%), 대표 이미지/아이콘을
        카드 형태로 보여줍니다. 기존 응답 필드(subWalletId, walletType, name, currency,
        currentBalance, isLocked)에는 목표 저축 관련 필드가 전혀 없습니다.
      - Figma 화면 상단에는 "Pots에 배정된 금액", "사용 가능 금액" 같은 집계 값도 표시되므로
        목록 API 응답에 요약(summary) 블록 추가가 필요합니다.

      [추가 필요]
      - targetAmount(목표 금액), currentSavedAmount 또는 progressPercent, iconKey/imageUrl
    responses:
      '200':
        description: 조회 성공
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas.yaml#/ApiResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        summary:
                          type: object
                          description: "[추가 필요] Figma Pots 화면 상단 요약 영역"
                          properties:
                            monthlyBudgetHome:
                              type: number
                            potsAllocatedAmountHome:
                              type: number
                            availableAmountHome:
                              type: number
                        subWallets:
                          type: array
                          items:
                            $ref: '../components/schemas.yaml#/SubWalletResponse'

  post:
    tags: [Wallet & Pot]
    summary: 서브 지갑(Pot) 생성 | 텐텐
    description: |
      [변경 필요]
      - Figma "Pots_새로 만들기" 화면 필드: "Pots 이름", "목표 금액", "대표 카테고리",
        "대표 이미지"(이모티콘 선택 또는 직접 업로드) — 기존 요청 필드(walletType, name,
        currency, currentBalance, categoryId, isLocked)와 다릅니다. currency 입력 UI는
        이 화면에서 확인되지 않았습니다.

      [확인 필요]
      - Pot 생성 시 currency를 사용자가 직접 지정하는지, 홈 통화로 고정되는지
      - "직접 업로드" 이미지의 저장 방식(별도 파일 업로드 API 필요 여부)
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [walletType, name, currentBalance, isLocked]
            properties:
              walletType:
                $ref: '../components/schemas.yaml#/WalletType'
              name:
                type: string
              currency:
                type: string
                nullable: true
                description: "[확인 필요] Pot 생성 화면에 통화 선택 UI 미확인"
              currentBalance:
                type: number
              categoryId:
                type: integer
                format: int64
                nullable: true
              isLocked:
                type: boolean
              targetAmount:
                type: number
                nullable: true
                description: "[추가 필요] Figma Pots_새로 만들기 화면의 목표 금액"
              iconKey:
                type: string
                nullable: true
                description: "[추가 필요] 대표 이미지/이모티콘 선택값"
    responses:
      '200':
        description: 생성 성공
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas.yaml#/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '../components/schemas.yaml#/SubWalletResponse'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'

sub-wallet-detail:
  get:
    tags: [Wallet & Pot]
    summary: 서브 지갑(Pot) 상세 조회 | 텐텐
    description: |
      [변경 필요] 목록 API와 동일하게 targetAmount 등 필드 확장 필요.
    parameters:
      - name: subWalletId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '200':
        description: 조회 성공
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas.yaml#/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '../components/schemas.yaml#/SubWalletResponse'
      '404':
        $ref: '../components/responses.yaml#/NotFound'

  patch:
    tags: [Wallet & Pot]
    summary: 서브 지갑(Pot) 수정 | 텐텐
    description: |
      [변경 필요] POST /sub-wallets 와 동일한 필드 확장 필요.
    parameters:
      - name: subWalletId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    requestBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
                nullable: true
              categoryId:
                type: integer
                format: int64
                nullable: true
              targetAmount:
                type: number
                nullable: true
                description: "[추가 필요]"
              iconKey:
                type: string
                nullable: true
                description: "[추가 필요]"
    responses:
      '200':
        description: 수정 성공
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas.yaml#/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '../components/schemas.yaml#/SubWalletResponse'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '404':
        $ref: '../components/responses.yaml#/NotFound'

sub-wallet-deposits:
  post:
    tags: [Wallet & Pot]
    summary: Pot 목표 금액 추가 납입 | 텐텐
    description: |
      [확인 필요]
      - 메인 지갑에서 차감 후 Pot으로 이체하는 구조인지(WalletTransfer 엔티티 활용),
        아니면 Pot 잔액만 단순 증가시키는 구조인지
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [amount]
            properties:
              amount:
                type: number
    parameters:
      - name: subWalletId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '200':
        description: "[확인 필요] 응답 형식 미확정"
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ApiResponse'

