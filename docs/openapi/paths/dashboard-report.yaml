# Dashboard & Report — path definitions (split out of the bundled openapi.yaml for lower merge-conflict risk)
# Edit here, then regenerate src/main/resources/static/docs/openapi.yaml via:
#   npx -y @redocly/cli bundle docs/openapi/openapi.yaml -o src/main/resources/static/docs/openapi.yaml

dashboard:
  get:
    tags: [Dashboard & Report]
    summary: 홈 대시보드 조회 | 텐텐
    description: |
      [추가 필요]
      - Figma 홈/Pots 화면에는 "Pots에 배정된 금액", "사용 가능 금액" 같은 Pot 집계 정보도
        함께 노출됩니다. 기존 응답에는 Pot 관련 집계 필드가 없어 추가가 필요합니다.
      - 홈 화면 상단의 캐릭터 문구("오늘도 목표를 향해 한 걸음!" 등)는 기존 문서에서도
        "캐릭터 말하기 기능은 API 없음 — 백엔드로 내려줄지 프론트 정적 배열로 둘지 결정 필요"로
        이미 확인 필요 사항으로 남아 있습니다. 아래 characterMessage 필드는 초안입니다.
    parameters:
      - name: yearMonth
        in: query
        required: false
        schema:
          type: string
          example: "2026-07"
    responses:
      '200':
        description: 조회 성공
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas.yaml#/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '../components/schemas.yaml#/DashboardResponse'

monthly:
  get:
    tags: [Dashboard & Report]
    summary: 월별 리포트 조회 | 소온
    description: |
      [변경 필요]
      - Figma "리포트" 화면은 기존 문서보다 훨씬 풍부합니다: 월별 지출 막대 그래프, 최근
        N일 지출 라인 그래프("오늘 지출이 어제보다 5% 증가했어요" 같은 전일 대비 증감 문구),
        카테고리별 지출 비중, "리포트 미리보기" 모달, "이메일로 리포트 보내기" 버튼.
        기존 응답(yearMonth, homeCurrency, totalExpenseHome, dailyExpenses)만으로는
        이 화면을 구성할 수 없어 필드 확장이 필요합니다.

      [확인 필요]
      - MVP 포함 여부 최종 확정 (기존 문서 자체의 미확정 사항)
      - GET /reports/categories 와 화면/데이터가 상당 부분 겹쳐 보여 두 API를 통합할지 확인 필요
    parameters:
      - name: yearMonth
        in: query
        required: true
        schema:
          type: string
          example: "2026-07"
    responses:
      '200':
        description: 조회 성공
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas.yaml#/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '../components/schemas.yaml#/MonthlyReportResponse'

monthly-email:
  post:
    tags: [Dashboard & Report]
    summary: 리포트 이메일 발송 신청/설정 | 소온
    description: |
      [확인 필요]
      - 설정 화면 문구는 "매일"이지만 기존 리포트 API는 "월별(monthly)"입니다. 실제 발송
        주기(일간/월간)를 확정해야 합니다.
      - "설정에서의 토글(구독 on/off)"과 "리포트 화면의 즉시 발송 버튼"이 같은 기능인지,
        별도 기능인지 확인 필요.
    requestBody:
      content:
        application/json:
          schema:
            type: object
            description: "[확인 필요] 발송 주기 미확정으로 필드 미확정"
    responses:
      '200':
        description: "[확인 필요]"
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ApiResponse'

categories:
  get:
    tags: [Dashboard & Report]
    summary: 카테고리별 리포트 조회 | 소온
    description: |
      [확인 필요]
      - Figma "리포트" 화면에서 카테고리별 비중이 /reports/monthly 응답과 함께 한 화면에
        표시되는 것으로 보여, 이 API가 별도로 필요한지 /reports/monthly로 흡수할지 확인 필요.
    parameters:
      - name: yearMonth
        in: query
        required: true
        schema:
          type: string
          example: "2026-07"
    responses:
      '200':
        description: 조회 성공
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas.yaml#/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '../components/schemas.yaml#/CategoryReportResponse'

