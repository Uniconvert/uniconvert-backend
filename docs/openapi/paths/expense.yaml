# Expense — path definitions (split out of the bundled openapi.yaml for lower merge-conflict risk)
# Edit here, then regenerate src/main/resources/static/docs/openapi.yaml via:
#   npx -y @redocly/cli bundle docs/openapi/openapi.yaml -o src/main/resources/static/docs/openapi.yaml

expenses:
  post:
    tags: [Expense]
    summary: 지출 등록 | 소온
    description: |
      [확인 필요]
      - Figma 화면에서 rateMode(AUTO/MANUAL), manualRate를 직접 입력하는 UI를 이번 분석
        범위에서 확인하지 못했습니다. "적용 환율" 텍스트는 자동 계산된 값을 보여주는 미리보기로
        보이며, 수동 환율 입력 여부는 확인이 필요합니다.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [subWalletId, categoryId, originalAmount, originalCurrency, spentAt, rateMode]
            properties:
              subWalletId:
                type: integer
                format: int64
              categoryId:
                type: integer
                format: int64
              originalAmount:
                type: number
              originalCurrency:
                type: string
              spentAt:
                type: string
                format: date-time
              merchantName:
                type: string
                nullable: true
              memo:
                type: string
                nullable: true
                maxLength: 200
              rateMode:
                $ref: '../components/schemas.yaml#/ExpenseRateMode'
              manualRate:
                type: number
                nullable: true
    responses:
      '200':
        description: 등록 성공
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas.yaml#/ApiResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        expenseId:
                          type: integer
                          format: int64
                        appliedRate:
                          type: number
                        rateSource:
                          type: string
                        convertedAmountHome:
                          type: number
                        subWalletBalance:
                          type: number
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '403':
        description: 잠금 지갑에는 지출을 등록할 수 없음
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ApiResponse'

  get:
    tags: [Expense]
    summary: 지출 목록 조회 (필터) | 소온
    description: |
      [확인 필요]
      - subWalletId, categoryId 필터 UI를 이번 분석 범위에서 명확히 확인하지 못했습니다.
        월(yearMonth) 필터만 우선 노출되는지 확인 필요.
      - 기본 정렬 기준(최신순 등)
    parameters:
      - name: yearMonth
        in: query
        required: false
        schema:
          type: string
          example: "2026-07"
      - name: subWalletId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: categoryId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          default: 20
    responses:
      '200':
        description: 조회 성공
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas.yaml#/ApiResponse'
                - type: object
                  properties:
                    data:
                      allOf:
                        - $ref: '../components/schemas.yaml#/PageResponse'
                        - type: object
                          properties:
                            content:
                              type: array
                              items:
                                $ref: '../components/schemas.yaml#/ExpenseSummaryResponse'

expense-detail:
  get:
    tags: [Expense]
    summary: 지출 상세 조회 | 소온
    parameters:
      - name: expenseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '200':
        description: 조회 성공
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas.yaml#/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '../components/schemas.yaml#/ExpenseDetailResponse'
      '404':
        $ref: '../components/responses.yaml#/NotFound'

  patch:
    tags: [Expense]
    summary: 지출 수정 | 소온
    parameters:
      - name: expenseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    requestBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              subWalletId:
                type: integer
                format: int64
                nullable: true
              categoryId:
                type: integer
                format: int64
                nullable: true
              originalAmount:
                type: number
                nullable: true
              originalCurrency:
                type: string
                nullable: true
              spentAt:
                type: string
                format: date-time
                nullable: true
              merchantName:
                type: string
                nullable: true
              memo:
                type: string
                nullable: true
              rateUpdateMode:
                $ref: '../components/schemas.yaml#/RateUpdateMode'
    responses:
      '200':
        description: 수정 성공
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas.yaml#/ApiResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        expenseId:
                          type: integer
                          format: int64
                        appliedRate:
                          type: number
                        convertedAmountHome:
                          type: number
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '404':
        $ref: '../components/responses.yaml#/NotFound'

  delete:
    tags: [Expense]
    summary: 지출 삭제 | 소온
    parameters:
      - name: expenseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '200':
        description: 삭제 성공
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas.yaml#/ApiResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        subWalletBalance:
                          type: number
      '404':
        $ref: '../components/responses.yaml#/NotFound'

import:
  post:
    tags: [Expense]
    summary: CSV 지출내역 자동 저장 (Wise/Monzo)
    description: |
      Wise 또는 Monzo 계좌 명세서 CSV를 업로드하면 헤더로 형식을 자동 판별해 지출성 거래만 저장합니다.

      - Wise: `Amount < 0` 이고 `State = COMPLETED` 인 거래만 저장
      - Monzo: `Money Out`이 있거나 `Amount < 0`인 거래만 저장
      - 입금·충전·취소 거래는 저장하지 않고 `excludedCount`로 집계
      - 거래일·통화 기준으로 환율을 조회(DB 우선, 없으면 외부 API)해 홈 통화 금액으로 저장하며,
        같은 거래일·통화 조합은 한 번만 조회합니다.
      - 환율을 구하지 못한 행은 임의 환율로 저장하지 않고 `errors`에 사유와 함께 담아 반환하며,
        나머지 정상 행은 계속 처리합니다.
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file]
            properties:
              file:
                type: string
                format: binary
                description: Wise 또는 Monzo 계좌 명세서 CSV 파일
    responses:
      '200':
        description: 처리 완료 (일부 행이 제외·오류일 수 있어도 200으로 응답하고 건수로 결과를 알려줍니다)
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas.yaml#/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '../components/schemas.yaml#/ExpenseImportResponse'
      '400':
        description: 빈 파일이거나 Wise/Monzo 형식으로 판별할 수 없는 CSV (EMPTY_FILE/INVALID_CSV_FORMAT)
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ApiResponse'

merchant-category-suggest:
  get:
    tags: [Expense]
    summary: 가맹점 카테고리 추천 | 소온
    description: |
      [확인 필요]
      - 이번 Figma 분석 범위(node-id 748:547)에서 이 추천 기능이 화면에 노출되는지
        명확히 확인하지 못했습니다. 지출입력 화면의 상점 입력 시 자동 추천이 적용되는지 확인 필요.
    parameters:
      - name: merchantName
        in: query
        required: true
        schema:
          type: string
          example: Tesco
    responses:
      '200':
        description: 조회 성공
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas.yaml#/ApiResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        merchantName:
                          type: string
                        suggestedCategory:
                          type: object
                          properties:
                            categoryId:
                              type: integer
                              format: int64
                            name:
                              type: string

