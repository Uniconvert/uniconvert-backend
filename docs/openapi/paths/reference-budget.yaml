# Reference & Budget — path definitions (split out of the bundled openapi.yaml for lower merge-conflict risk)
# Edit here, then regenerate src/main/resources/static/docs/openapi.yaml via:
#   npx -y @redocly/cli bundle docs/openapi/openapi.yaml -o src/main/resources/static/docs/openapi.yaml

currencies:
  get:
    tags: [Reference & Budget]
    summary: 지원 통화 목록 조회 | 텐텐
    description: |
      [확인 필요]
      - Figma 환율 계산기 화면에는 GBP(£)도 등장합니다. 기존 문서 예시에는 5개 통화만
        언급되어 있어, 지원 통화 목록에 GBP를 포함해야 하는지 확인이 필요합니다.
    responses:
      '200':
        description: 조회 성공
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas.yaml#/ApiResponse'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '../components/schemas.yaml#/CurrencyResponse'

categories:
  get:
    tags: [Reference & Budget]
    summary: 기본 지출 카테고리 목록 조회 | 소온
    responses:
      '200':
        description: 조회 성공
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas.yaml#/ApiResponse'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '../components/schemas.yaml#/CategoryResponse'

budgets-year-month:
  get:
    tags: [Reference & Budget]
    summary: 월 예산 조회 | 소온
    parameters:
      - name: yearMonth
        in: path
        required: true
        schema:
          type: string
          example: "2026-07"
    responses:
      '200':
        description: 조회 성공
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas.yaml#/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '../components/schemas.yaml#/BudgetResponse'
      '404':
        $ref: '../components/responses.yaml#/NotFound'

  put:
    tags: [Reference & Budget]
    summary: 월 예산 생성·수정 (upsert) | 소온
    description: |
      [확인 필요]
      - 온보딩 단계 외에 예산을 수정하는 화면을 이번 Figma 분석 범위에서 명확히 확인하지
        못했습니다. 설정 화면 또는 별도 화면 존재 여부 확인 필요.
    parameters:
      - name: yearMonth
        in: path
        required: true
        schema:
          type: string
          example: "2026-07"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [monthlyLimitHome]
            properties:
              monthlyLimitHome:
                type: number
    responses:
      '200':
        description: 저장 성공
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas.yaml#/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '../components/schemas.yaml#/BudgetResponse'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'

