# Shared OpenAPI parameters

BrowserLanguageHeader:
  name: X-Browser-Language
  in: header
  required: false
  description: |
    사용자의 브라우저 언어 정보입니다.

    프론트엔드는 브라우저의 navigator.language 값을 전달합니다.
    값이 없거나 지원하지 않는 값인 경우 서버는 ko-KR을 기본값으로 사용합니다.

    [확인 필요] 지원 가능한 브라우저 언어 코드 목록이 기획/코드 어디에도 확정되어 있지
    않습니다. 예시로 ko-KR, en-US, ja-JP를 기재했으나 최종 지원 목록 확정이 필요합니다.
    서버는 SwaggerConfig의 GlobalOpenApiCustomizer를 통해 이 파라미터를 모든 API 경로에
    자동으로 노출합니다. 실제 언어별 처리(다국어 메시지 소스 등)는 아직 코드에 구현되어
    있지 않습니다.
  schema:
    type: string
    example: ko-KR
    default: ko-KR

