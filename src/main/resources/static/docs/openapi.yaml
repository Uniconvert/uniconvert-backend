  /reports/monthly:
    get:
      tags:
        - Dashboard & Report
      summary: 월별 리포트 조회 | 소온
      description: |
        [변경 필요]
        - Figma "리포트" 화면은 기존 문서보다 훨씬 풍부합니다: 월별 지출 막대 그래프, 최근
          N일 지출 라인 그래프("오늘 지출이 어제보다 5% 증가했어요" 같은 전일 대비 증감 문구),
          카테고리별 지출 비중, "리포트 미리보기" 모달, "이메일로 리포트 보내기" 버튼.
          기존 응답(yearMonth, homeCurrency, totalExpenseHome, dailyExpenses)만으로는
          이 화면을 구성할 수 없어 필드 확장이 필요합니다.

        [확인 필요]
        - MVP 포함 여부 최종 확정 (기존 문서 자체의 미확정 사항)
        - GET /reports/categories 와 화면/데이터가 상당 부분 겹쳐 보여 두 API를 통합할지 확인 필요
      parameters:
        - name: yearMonth
          in: query
          required: true
          schema:
            type: string
            example: 2026-07
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MonthlyReportResponse'
  /reports/monthly/email:
    post:
      tags:
        - Dashboard & Report
      summary: 리포트 이메일 발송 신청/설정 | 소온
      description: |
        [확인 필요]
        - 설정 화면 문구는 "매일"이지만 기존 리포트 API는 "월별(monthly)"입니다. 실제 발송
          주기(일간/월간)를 확정해야 합니다.
        - "설정에서의 토글(구독 on/off)"과 "리포트 화면의 즉시 발송 버튼"이 같은 기능인지,
          별도 기능인지 확인 필요.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: '[확인 필요] 발송 주기 미확정으로 필드 미확정'
      responses:
        '200':
          description: '[확인 필요]'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /reports/categories:
    get:
      tags:
        - Dashboard & Report
      summary: 카테고리별 리포트 조회 | 소온
      description: |
        [확인 필요]
        - Figma "리포트" 화면에서 카테고리별 비중이 /reports/monthly 응답과 함께 한 화면에
          표시되는 것으로 보여, 이 API가 별도로 필요한지 /reports/monthly로 흡수할지 확인 필요.
      parameters:
        - name: yearMonth
          in: query
          required: true
          schema:
            type: string
            example: 2026-07
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CategoryReportResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    BrowserLanguageHeader:
      name: X-Browser-Language
      in: header
      required: false
      description: |
        사용자의 브라우저 언어 정보입니다.

        프론트엔드는 브라우저의 navigator.language 값을 전달합니다.
        값이 없거나 지원하지 않는 값인 경우 서버는 ko-KR을 기본값으로 사용합니다.

        [확인 필요] 지원 가능한 브라우저 언어 코드 목록이 기획/코드 어디에도 확정되어 있지
        않습니다. 예시로 ko-KR, en-US, ja-JP를 기재했으나 최종 지원 목록 확정이 필요합니다.
        서버는 SwaggerConfig의 GlobalOpenApiCustomizer를 통해 이 파라미터를 모든 API 경로에
        자동으로 노출합니다. 실제 언어별 처리(다국어 메시지 소스 등)는 아직 코드에 구현되어
        있지 않습니다.
      schema:
        type: string
        example: ko-KR
        default: ko-KR
  responses:
    BadRequest:
      description: 잘못된 요청 (INVALID_REQUEST/VALIDATION_FAILED)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    Unauthorized:
      description: 인증 필요 또는 토큰 만료 (UNAUTHORIZED)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    Forbidden:
      description: 권한 없음 / 잠금 지갑 접근 (FORBIDDEN)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    NotFound:
      description: 리소스를 찾을 수 없음 (RESOURCE_NOT_FOUND)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    Conflict:
      description: 중복된 리소스 (DUPLICATE_RESOURCE)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    InsufficientBalance:
      description: 지갑 잔액 부족 (INSUFFICIENT_BALANCE)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
  schemas:
    ApiResponse:
      type: object
      description: |
        공통 응답 포맷 (com.uniconvert.backend.global.response.ApiResponse 와 동일 구조).
        data는 성공 시 각 API 응답 데이터로 대체되며, 실패 시 null입니다.
      properties:
        success:
          type: boolean
        code:
          type: string
          example: SUCCESS
        message:
          type: string
          example: 요청이 성공했습니다.
        data:
          type: object
          nullable: true
    PageResponse:
      type: object
      properties:
        content:
          type: array
          items: {}
        page:
          type: integer
        size:
          type: integer
        hasNext:
          type: boolean
    TermsType:
      type: string
      description: com.uniconvert.backend.domain.auth.enums.TermsType
      enum:
        - SERVICE
        - PRIVACY
        - MARKETING
    AuthProvider:
      type: string
      description: com.uniconvert.backend.domain.auth.enums.AuthProvider
      enum:
        - GOOGLE
        - APPLE
    WalletType:
      type: string
      description: com.uniconvert.backend.domain.wallet.enums.WalletType
      enum:
        - BANK_ACCOUNT
        - CASH
        - POT
    MainWalletTransactionType:
      type: string
      description: |
        com.uniconvert.backend.domain.wallet.enums.MainWalletTransactionType
        [변경 필요] TRANSFER_OUT은 기존 API 설계 문서에는 언급되지 않은 값입니다.
      enum:
        - DEPOSIT
        - MANUAL_SET
        - TRANSFER_OUT
    ExpenseRateMode:
      type: string
      description: com.uniconvert.backend.domain.expense.enums.ExpenseRateMode
      enum:
        - DAILY_AVERAGE
        - MANUAL
    RateUpdateMode:
      type: string
      description: com.uniconvert.backend.domain.expense.enums.RateUpdateMode (기존 문서의 AUTO/MANUAL과 이름이 다름)
      enum:
        - KEEP
        - RECALCULATE
    DailyRateStatus:
      type: string
      description: com.uniconvert.backend.domain.exchange.enums.DailyRateStatus
      enum:
        - PRELIMINARY
        - FINAL
    UserMeResponse:
      type: object
      properties:
        userId:
          type: integer
          format: int64
        email:
          type: string
        nickname:
          type: string
          nullable: true
        profileImageKey:
          type: string
          nullable: true
          description: 프론트 에셋에서 선택된 프로필 이미지 key
          example: profile_03
        primaryGoal:
          type: string
          nullable: true
          description: 사용자가 선택한 주요 관리 목표
          example: SAVE_MORE
        homeCurrencyCode:
          type: string
          nullable: true
        localCurrencyCode:
          type: string
          nullable: true
        timezone:
          type: string
          nullable: true
        onboardingStep:
          type: integer
        onboardingCompleted:
          type: boolean
        onboardingCompletedAt:
          type: string
          format: date-time
          nullable: true
    CurrencyResponse:
      type: object
      properties:
        code:
          type: string
          description: ISO 4217 3자리
        nameKo:
          type: string
        nameEn:
          type: string
        symbol:
          type: string
        isSupported:
          type: boolean
    CategoryResponse:
      type: object
