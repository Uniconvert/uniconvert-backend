          required: false
          schema:
            type: number
          description: '[확인 필요] 계산기 화면에서 입력 UI 미확인'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ExchangeQuoteResponse'
