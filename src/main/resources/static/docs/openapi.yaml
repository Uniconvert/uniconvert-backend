openapi: 3.0.3
info:
  title: Uniconvert API
  version: v1
  description: |
    Uniconvert backend API documentation (draft).
  contact:
    name: Uniconvert
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: 인증·JWT (회원가입/로그인/이메일 인증/토큰 재발급)
  - name: User & Onboarding
    description: 내 정보, 온보딩, 설정
  - name: Reference & Budget
    description: 통화·카테고리 기준 데이터, 월 예산
  - name: Wallet & Pot
    description: 메인 지갑, 서브 지갑(Pot)
  - name: Exchange Rate
    description: 환율 조회 및 계산기
  - name: Expense
    description: 지출 등록·조회·수정·삭제, 영수증/명세서 업로드
  - name: Dashboard & Report
    description: 홈 대시보드, 리포트
paths:
  /auth/local/sign-up:
    post:
      tags:
        - Auth
      summary: 자체 회원가입 | 텐텐
      description: |
        [확인 필요]
        - Figma에는 약관 동의가 "약관동의" 화면으로 별도 분리되어 있습니다. 약관 동의 데이터가
          이 API 요청(terms 배열)에 함께 전달되는지, 아니면 별도 API/스텝으로 저장되는지 확정 필요.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - terms
              properties:
                email:
                  type: string
                  format: email
                  description: 로그인 이메일
                password:
                  type: string
                  format: password
                  description: 영문·숫자·특수문자 포함
                terms:
                  type: array
                  description: 약관 동의 목록. SERVICE, PRIVACY는 필수 동의.
                  items:
                    type: object
                    required:
                      - termsType
                      - isAgreed
                    properties:
                      termsType:
                        $ref: '#/components/schemas/TermsType'
                      termsVersion:
                        type: string
                        nullable: true
                      isAgreed:
                        type: boolean
      responses:
        '200':
          description: 회원가입 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          userId:
                            type: integer
                            format: int64
                            description: 생성된 회원 ID
                          accessToken:
                            type: string
                          refreshToken:
                            type: string
                          isOnboardingCompleted:
                            type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /auth/local/login:
    post:
      tags:
        - Auth
      summary: 자체 로그인 | 텐텐
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          accessToken:
                            type: string
                          refreshToken:
                            type: string
                          isOnboardingCompleted:
                            type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/social/login:
    post:
      tags:
        - Auth
      summary: 소셜 로그인/회원가입 (Google/Apple) | 텐텐
      description: |
        [확인 필요]
        - Apple 로그인도 함께 제공할지 (코드의 AuthProvider에는 APPLE도 존재하나 Figma에서는
          Google 버튼만 확인됨)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - provider
                - idToken
              properties:
                provider:
                  $ref: '#/components/schemas/AuthProvider'
                idToken:
                  type: string
                  description: 소셜 provider가 발급한 ID Token
      responses:
        '200':
          description: 소셜 로그인/회원가입 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          userId:
                            type: integer
                            format: int64
                          accessToken:
                            type: string
                          refreshToken:
                            type: string
                          isOnboardingCompleted:
                            type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/email-verifications:
    post:
      tags:
        - Auth
      summary: 이메일 인증 메일 발송 | 텐텐
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: 인증 메일 발송 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          expiresAt:
                            type: string
                            format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'
  /auth/email-verifications/confirm:
    post:
      tags:
        - Auth
      summary: 이메일 인증 완료 | 텐텐
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
      responses:
        '200':
          description: 인증 완료
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          isEmailVerified:
                            type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
  /auth/token/reissue:
    post:
      tags:
        - Auth
      summary: Access Token 재발급 | 텐텐
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: 재발급 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          accessToken:
                            type: string
                          refreshToken:
                            type: string
                            description: 회전(rotate) 정책 적용 시 새 Refresh Token
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/me:
    get:
      tags:
        - User & Onboarding
      summary: 내 정보 조회 | 텐텐
      description: |
        사용자 프로필 정보를 조회합니다.
        프로필 이미지는 프론트에 준비된 에셋 중 선택된 이미지의 key를
        profileImageKey 필드로 반환합니다.
        사용자가 선택한 주요 관리 목표는 primaryGoal 필드로 반환합니다.
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserMeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags:
        - User & Onboarding
      summary: 내 정보 수정 (설정) | 텐텐
      description: |
        사용자 프로필 정보를 수정합니다.
        프로필 이미지는 직접 업로드하지 않고 프론트 에셋 중 선택된 이미지의 key를
        profileImageKey로 전달합니다.
        주요 관리 목표는 primaryGoal로 전달합니다.

        [확인 필요]
        - Figma 설정 화면에서 timezone을 수정하는 UI를 이번 분석 범위에서 확인하지 못했습니다.
          온보딩에서만 설정하고 이후 변경 불가인지 확인 필요.
        - 홈 통화 변경 시 기존 지출 재계산 여부는 프론트 확인 팝업 후 요청(기존 문서 메모 유지).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nickname:
                  type: string
                  nullable: true
                profileImageKey:
                  type: string
                  nullable: true
                  maxLength: 100
                  description: 프론트 에셋에서 선택된 프로필 이미지 key
                  example: profile_03
                primaryGoal:
                  type: string
                  nullable: true
                  maxLength: 100
                  description: 사용자가 선택한 주요 관리 목표
                  example: SAVE_MORE
                homeCurrency:
                  type: string
                  nullable: true
                localCurrencies:
                  type: array
                  nullable: true
                  items:
                    type: string
                timezone:
                  type: string
                  nullable: true
                  description: '[확인 필요] 설정 화면에서 실제로 수정 가능한지 미확인'
      responses:
        '200':
          description: 수정 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserMeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /onboarding/complete:
    post:
      tags:
        - User & Onboarding
      summary: 온보딩 완료 (통화·예산·메인 지갑 일괄 저장) | 텐텐
      description: |
        온보딩 과정에서 사용자가 선택한 프로필 설정 정보를 저장합니다.

        프로필 이미지는 사용자가 직접 업로드하지 않고,
        프론트에 준비된 에셋 중 선택된 이미지의 key만
        profileImageKey로 전달합니다.

        사용자가 선택한 주요 관리 목표는 primaryGoal로 저장합니다.

        [확인 필요]
        - monthlyBudgetHome, mainWalletInitialBalance를 입력받는 화면을 이번 Figma 분석 범위에서
          명확히 특정하지 못했습니다. 별도 스텝인지, 다른 값으로 대체되었는지 확인 필요.
        - 서비스 약관 동의 날짜를 정확히 기록해야 한다는 담당자 메모(P0 v3 문서 내)가 있어
          TermsAgreement.agreedAt 저장 시점을 온보딩 완료 시점과 맞출지 별도 스텝(회원가입 시)으로
          할지 확인 필요.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nickname
                - homeCurrency
                - localCurrencies
                - timezone
              properties:
                nickname:
                  type: string
                homeCurrency:
                  type: string
                localCurrencies:
                  type: array
                  items:
                    type: string
                timezone:
                  type: string
                monthlyBudgetHome:
                  type: number
                  nullable: true
                  description: '[확인 필요] 입력 화면 미특정'
                mainWalletInitialBalance:
                  type: number
                  nullable: true
                  description: '[확인 필요] 입력 화면 미특정'
                primaryGoal:
                  type: string
                  nullable: true
                  maxLength: 100
                  description: 사용자가 선택한 주요 관리 목표
                  example: SAVE_MORE
                profileImageKey:
                  type: string
                  nullable: true
                  maxLength: 100
                  description: 프론트 에셋에서 선택된 프로필 이미지 key
                  example: profile_03
      responses:
        '200':
          description: 온보딩 완료
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          mainWalletId:
                            type: integer
                            format: int64
                          budgetId:
                            type: integer
                            format: int64
                          isOnboardingCompleted:
                            type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
  /currencies:
    get:
      tags:
        - Reference & Budget
      summary: 지원 통화 목록 조회 | 텐텐
      description: |
        [확인 필요]
        - Figma 환율 계산기 화면에는 GBP(£)도 등장합니다. 기존 문서 예시에는 5개 통화만
          언급되어 있어, 지원 통화 목록에 GBP를 포함해야 하는지 확인이 필요합니다.
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/CurrencyResponse'
  /categories:
    get:
      tags:
        - Reference & Budget
      summary: 기본 지출 카테고리 목록 조회 | 소온
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/CategoryResponse'
  /budgets/{yearMonth}:
    get:
      tags:
        - Reference & Budget
      summary: 월 예산 조회 | 소온
      parameters:
        - name: yearMonth
          in: path
          required: true
          schema:
            type: string
            example: 2026-07
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/BudgetResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - Reference & Budget
      summary: 월 예산 생성·수정 (upsert) | 소온
      description: |
        [확인 필요]
        - 온보딩 단계 외에 예산을 수정하는 화면을 이번 Figma 분석 범위에서 명확히 확인하지
          못했습니다. 설정 화면 또는 별도 화면 존재 여부 확인 필요.
      parameters:
        - name: yearMonth
          in: path
          required: true
          schema:
            type: string
            example: 2026-07
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - monthlyLimitHome
              properties:
                monthlyLimitHome:
                  type: number
      responses:
        '200':
          description: 저장 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/BudgetResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /main-wallet:
    get:
      tags:
        - Wallet & Pot
      summary: 메인 지갑 잔액 조회 | 텐텐
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MainWalletResponse'
  /main-wallet/transactions:
    post:
      tags:
        - Wallet & Pot
      summary: 메인 지갑 입금·수동 잔액 조정 | 텐텐
      description: |
        [변경 필요]
        - 기존 문서에는 type 값으로 DEPOSIT, MANUAL_SET만 언급되어 있으나,
          실제 코드의 MainWalletTransactionType enum에는 TRANSFER_OUT 값이 이미 정의되어 있습니다.
        - 지갑 간 이체(WalletTransfer 엔티티도 이미 존재) 기능과 연동되는 것으로 보이나,
          기존 문서는 지갑 이체 API 자체를 "지갑 세부 기능 제외"로 스코프아웃했습니다.
        - enum 값과 스코프를 맞출지 확인이 필요합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - type
                - amount
              properties:
                type:
                  $ref: '#/components/schemas/MainWalletTransactionType'
                amount:
                  type: number
                memo:
                  type: string
                  nullable: true
      responses:
        '200':
          description: 처리 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          mainWalletTransactionId:
                            type: integer
                            format: int64
                          currentBalance:
                            type: number
        '400':
          $ref: '#/components/responses/BadRequest'
  /pots:
    post:
      tags:
        - Wallet & Pot
      summary: Pot 생성 | 텐텐
      description: |
        새로운 목표 저축 Pot을 생성합니다.

        Pot 대표 이미지는 이미지 파일이나 URL 자체를 백엔드에 저장하지 않습니다.
        프론트에 준비된 에셋 중 사용자가 선택한 이미지의 key를
        representativeImageKey로 전달하고 백엔드는 해당 key만 저장합니다.

        입력값:
        - name: Pot 이름
        - goalCategory: 대표 목표 카테고리
        - representativeImageKey: 프론트 에셋에서 선택한 Pot 대표 이미지 key
        - targetAmount: 최종 목표 금액
        - monthlyAllocation: 매월 저축할 계획 금액
        - displayOrder: 화면에 표시할 순서

        생성 직후:
        - savedAmount는 0입니다.
        - thisMonthAmount는 0입니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - targetAmount
                - monthlyAllocation
              properties:
                name:
                  type: string
                  maxLength: 30
                  description: Pot 이름
                  example: 유럽 여행
                goalCategory:
                  type: string
                  nullable: true
                  maxLength: 30
                  description: Pot 대표 목표 카테고리
                  example: TRAVEL
                representativeImageKey:
                  type: string
                  nullable: true
                  maxLength: 100
                  description: 프론트 에셋에서 선택한 Pot 대표 이미지 key
                  example: pot_travel_01
                targetAmount:
                  type: number
                  description: 최종 목표 금액
                  example: 3000000
                monthlyAllocation:
                  type: number
                  description: 매월 저축할 계획 금액
                  example: 300000
                displayOrder:
                  type: integer
                  format: int64
                  nullable: true
                  description: Pot 화면 표시 순서
                  example: 1
      responses:
        '201':
          description: Pot 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PotResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      tags:
        - Wallet & Pot
      summary: Pot 목록 조회 | 텐텐
      description: |
        로그인한 사용자의 Pot 목록을 표시 순서대로 조회합니다.

        응답 금액 필드:
        - targetAmount: 최종 목표 금액
        - savedAmount: 모든 월의 실제 누적 배정 금액
        - monthlyAllocation: 매월 저축할 계획 금액
        - thisMonthAmount: 사용자 시간대 기준 이번 달 실제 배정 금액

        대표 이미지는 representativeImageKey로 반환합니다.

        includeArchived 사용법:
        - false: 보관되지 않은 Pot만 조회
        - true: 보관된 Pot을 포함하여 전체 조회

        호출 예시:
        GET /pots?includeArchived=false
      parameters:
        - name: includeArchived
          in: query
          required: false
          description: 보관된 Pot 포함 여부
          schema:
            type: boolean
            default: false
          example: false
      responses:
        '200':
          description: Pot 목록 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PotResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /pots/{potId}:
    get:
      tags:
        - Wallet & Pot
      summary: Pot 상세 조회 | 텐텐
      description: |
        지정한 Pot의 상세 정보를 조회합니다.

        응답에는 다음 정보가 포함됩니다.
        - Pot 이름
        - 대표 목표 카테고리
        - representativeImageKey
        - 최종 목표 금액
        - 실제 누적 배정 금액
        - 월 저축 계획 금액
        - 이번 달 실제 배정 금액
        - 보관 여부
        - 화면 표시 순서
      parameters:
        - name: potId
          in: path
          required: true
          description: 조회할 Pot ID
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        '200':
          description: Pot 상세 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PotResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Wallet & Pot
      summary: Pot 수정 | 텐텐
      description: |
        지정한 Pot의 정보를 수정합니다.

        변경 가능한 값:
        - name
        - goalCategory
        - representativeImageKey
        - targetAmount
        - monthlyAllocation
        - displayOrder

        representativeImageKey는 프론트 에셋에서 선택한
        Pot 대표 이미지의 key입니다.

        요청에서 생략된 값은 기존 값을 유지합니다.
      parameters:
        - name: potId
          in: path
          required: true
          description: 수정할 Pot ID
          schema:
            type: integer
            format: int64
          example: 1
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  nullable: true
                  maxLength: 30
                  description: 변경할 Pot 이름
                  example: 유럽 여행 경비
                goalCategory:
                  type: string
                  nullable: true
                  maxLength: 30
                  description: 변경할 대표 목표 카테고리
                  example: TRAVEL
                representativeImageKey:
                  type: string
                  nullable: true
                  maxLength: 100
                  description: 변경할 Pot 대표 이미지 key
                  example: pot_travel_02
                targetAmount:
                  type: number
                  nullable: true
                  description: 변경할 최종 목표 금액
                  example: 3500000
                monthlyAllocation:
                  type: number
                  nullable: true
                  description: 변경할 월 저축 계획 금액
                  example: 350000
                displayOrder:
                  type: integer
                  format: int64
                  nullable: true
                  description: 변경할 화면 표시 순서
                  example: 1
      responses:
        '200':
          description: Pot 수정 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PotResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /pots/{potId}/archive:
    patch:
      tags:
        - Wallet & Pot
      summary: Pot 보관 상태 변경 | 텐텐
      description: |
        지정한 Pot의 보관 상태를 변경합니다.

        - archived=true: Pot을 보관 처리합니다.
        - archived=false: 보관된 Pot을 다시 활성화합니다.
        - 보관된 Pot은 기본 GET /pots 조회에서 제외됩니다.
        - GET /pots?includeArchived=true로 조회하면 보관된 Pot도 확인할 수 있습니다.

        이 API는 Pot을 실제 삭제하지 않습니다.
        Pot 및 월별 배정 데이터는 DB에 유지됩니다.
      parameters:
        - name: potId
          in: path
          required: true
          description: 보관 상태를 변경할 Pot ID
          schema:
            type: integer
            format: int64
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
