          단순화된 것인지, 다른 화면에 해당 입력이 있는지 확인이 필요합니다.
        - 해당 날짜 환율이 DB에 없을 때 "프론트에 직접 입력 요청"하는 기존 정책이 Figma
          화면에서도 동일하게 노출되는지 확인 필요.
      parameters:
