# Uni character messages
EXPENSE_ENTRY_01=先从今天的支出开始慢慢看看吧。
EXPENSE_ENTRY_02=按类别查看支出趋势，会更容易发现需要调整的地方。
EXPENSE_RANDOM_01=先查看金额较大的支出，可以更快掌握整体消费趋势。
EXPENSE_RANDOM_02=反复出现的小额支付，一个月累积起来也可能比想象中更多。
EXPENSE_RANDOM_03=付款后马上记录，可以减少遗漏支出的情况。
EXPENSE_RANDOM_04=把必要支出和可选择支出分开查看也是个不错的方法。
EXPENSE_RANDOM_05=准确设置分类，会让下个月的分析更容易。
EXPENSE_RANDOM_06=相比单日支出，查看一周平均值更容易看清消费趋势。
EXPENSE_RANDOM_07=管理预算时，不只要看剩余金额，也要关注使用速度。
EXPENSE_RANDOM_08=看看有没有哪个类别的支出突然增加了。
EXPENSE_RANDOM_09=与其一次性大幅削减，不如先从一项重复支出开始调整。
EXPENSE_RANDOM_10=记录支出原因，之后做判断会轻松很多。
POTS_ENTRY_01=先看看目标金额和目前已经存下的金额吧。
POTS_ENTRY_02=看看是否按照计划持续累积中。
POTS_RANDOM_01=把目标拆小一些，每个月会更容易执行。
POTS_RANDOM_02=相比一次投入大额资金，持续稳定地分配更重要。
POTS_RANDOM_03=确认一下这个月的分配金额是否符合计划。
POTS_RANDOM_04=如果有多个目标，先排好优先顺序会更好。
POTS_RANDOM_05=在不影响生活费的范围内调整计划吧。
POTS_RANDOM_06=即使金额不大，只要持续积累，也会变成清晰可见的成果。
POTS_RANDOM_07=如果觉得目标金额太遥远，可以先检查每月计划金额。
POTS_RANDOM_08=完成的 Pot 可以归档，再整理下一个目标。
POTS_RANDOM_09=确认本月可用金额后，再决定是否追加分配。
POTS_RANDOM_10=比较各个目标的进度，会更容易决定优先哪个 Pot。
REPORT_ENTRY_01=我把这个月的支出趋势整理成数字了。
REPORT_ENTRY_02=先查看变化较大的项目，会更容易管理。
REPORT_RANDOM_01=不要只看总额，也一起看看各类别所占的比例。
REPORT_RANDOM_02=某一天的大额支出可能会影响整个月的趋势。
REPORT_RANDOM_03=和上个月比较，会更清楚地看到这个月的变化。
REPORT_RANDOM_04=金额和比例一起看，会更容易理解变化的原因。
REPORT_RANDOM_05=可以把固定发生的支出和一次性支出分开来看。
REPORT_RANDOM_06=查看每日平均支出，有助于规划剩余时间。
REPORT_RANDOM_07=也可以看看月末是否经常出现支出突然增加的情况。
REPORT_RANDOM_08=如果变化不大，说明目前的消费模式可能比较稳定。
REPORT_RANDOM_09=了解支出增加的原因，下个月的计划会更准确。
REPORT_RANDOM_10=与其只看结果，不如用报告来决定下一步行动。
MEMO_ENTRY_01=看看留下的备注，可以重新确认当时为什么会有这笔支出。
MEMO_ENTRY_02=记录越多，消费模式就会越清晰。
MEMO_RANDOM_01=把店铺名称和支出原因一起写下来，以后会更容易查找。
MEMO_RANDOM_02=备注不用写得很长，留下核心原因就够了。
MEMO_RANDOM_03=遇到意料之外的支出时，最好记录一下原因。
MEMO_RANDOM_04=如果出现重复的备注，可能代表一种固定的消费习惯。
MEMO_RANDOM_05=冲动消费的项目，可以之后再回头看看。
MEMO_RANDOM_06=有特别行程的那一天，把当时的情况也记录下来会更有帮助。
MEMO_RANDOM_07=即使只是简短记录，时间久了也会成为有用的判断依据。
MEMO_RANDOM_08=把同一家店的备注放在一起看，会更容易发现重复支出。
MEMO_RANDOM_09=每周检查一次备注，有助于整理自己的消费原因。
MEMO_RANDOM_10=相比没有记录的记忆，写下来的一句话更可靠。
CALCULATOR_ENTRY_01=输入金额和币种后，我会按当前汇率帮你计算。
CALCULATOR_ENTRY_02=付款前先确认换算金额，可以让预算管理更准确。
CALCULATOR_RANDOM_01=汇率可能会变化，大额支付前最好再确认一次。
CALCULATOR_RANDOM_02=先确认原始币种和目标币种的方向是否正确。
CALCULATOR_RANDOM_03=金额越大，即使汇率只差一点，也会影响最终金额。
CALCULATOR_RANDOM_04=制定旅行预算时，也可以参考预计换算金额。
CALCULATOR_RANDOM_05=设置 Pot 目标金额前，先换算成当地货币看看也不错。
CALCULATOR_RANDOM_06=周末或节假日可能会使用最近一个工作日的汇率。
CALCULATOR_RANDOM_07=即使只是小数点后的差异，多次支付后也可能累积起来。
CALCULATOR_RANDOM_08=即使金额相同，基准货币不同，结果也会不同。
CALCULATOR_RANDOM_09=实际扣款金额可能因发卡机构的汇率适用时间或手续费而不同。
CALCULATOR_RANDOM_10=可以把计算结果作为登记支出前的参考。
EXPENSE_INSIGHT_TODAY=今天支出了 {0}{1}。
EXPENSE_INSIGHT_TOP_CATEGORY=本月支出最多的类别是 {0}。
EXPENSE_INSIGHT_REMAINING_BUDGET=本月可用金额还剩 {0}{1}。
POTS_INSIGHT_PROGRESS={0} Pot 已完成目标的 {1}%。
POTS_INSIGHT_REMAINING=距离目标还差 {0}{1}。
POTS_INSIGHT_THIS_MONTH=本月已分配 {0}{1}。
REPORT_INSIGHT_INCREASE=今天的支出比昨天增加了 {0}%。
REPORT_INSIGHT_DECREASE=今天的支出比昨天减少了 {0}%。
REPORT_INSIGHT_WEEKLY_MAX=本周支出最多的是 {0}。
MEMO_INSIGHT_COUNT=目前已经留下了 {0} 条支出备注。
CALCULATOR_INSIGHT_RATE_CHANGE=今天的汇率比前一日 {1} {0}%。计算时可以参考一下。
CALCULATOR_DIRECTION_UP=上涨
CALCULATOR_DIRECTION_DOWN=下跌

# API error / validation i18n (I18N-08)
error.invalid_request=请求无效。
error.validation_failed=输入内容验证失败。
error.unauthorized=需要登录认证。
error.forbidden=您没有访问权限。
error.not_found=找不到请求的资源。
error.conflict=该请求与当前状态冲突。
error.token_invalid=令牌无效。
error.token_expired=令牌已过期。
error.login_invalid_credentials=密码输入错误。请重置密码。
error.login_password_failure_limit=密码连续不匹配。请重新确认账号或重新注册。
error.email_already_registered=该邮箱已注册。请登录。
error.internal_server_error=服务器内部发生错误。
error.budget_not_found=找不到该月份的预算。
error.expense_not_found=找不到该支出记录。
error.invalid_category=类别无效。
error.empty_file=上传的文件为空。
error.invalid_csv_format=不支持的 CSV 格式。（仅支持 Wise 或 Monzo 对账单）
error.unsupported_currency=不支持该货币。（仅支持 USD、EUR、JPY、CNY）

