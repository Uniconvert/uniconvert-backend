# Uni character messages
EXPENSE_ENTRY_01=Shall we start by checking today's spending?
EXPENSE_ENTRY_02=Looking at spending by category makes it easier to spot where you can adjust.
EXPENSE_RANDOM_01=Checking the largest expenses first helps you understand your spending flow quickly.
EXPENSE_RANDOM_02=Small recurring payments can add up to more than expected over a month.
EXPENSE_RANDOM_03=Recording a purchase right after paying can help you avoid missing expenses.
EXPENSE_RANDOM_04=It can help to separate necessary spending from optional spending.
EXPENSE_RANDOM_05=Accurate categories make next month's analysis easier.
EXPENSE_RANDOM_06=Weekly averages often show your spending pattern more clearly than a single day.
EXPENSE_RANDOM_07=With a budget, check not only how much is left but also how quickly you are using it.
EXPENSE_RANDOM_08=Take a look for any category that suddenly increased.
EXPENSE_RANDOM_09=Rather than cutting everything at once, try adjusting one recurring expense first.
EXPENSE_RANDOM_10=Adding a note about why you spent makes later decisions much easier.
POTS_ENTRY_01=Let us first check the target amount and how much you have saved so far.
POTS_ENTRY_02=Let us see whether your savings are building up according to plan.
POTS_RANDOM_01=Breaking a goal into smaller steps makes it easier to follow each month.
POTS_RANDOM_02=Consistent contributions matter more than making one large contribution.
POTS_RANDOM_03=Check whether this month's contribution matches your plan.
POTS_RANDOM_04=If you have several goals, setting priorities can help.
POTS_RANDOM_05=Adjust the plan within an amount that does not strain your living expenses.
POTS_RANDOM_06=Even small amounts become meaningful progress when you keep building them up.
POTS_RANDOM_07=If the target feels too far away, review your monthly planned amount first.
POTS_RANDOM_08=You can archive a completed Pot and move on to your next goal.
POTS_RANDOM_09=Check this month's available amount before deciding on an extra contribution.
POTS_RANDOM_10=Comparing progress across goals makes it easier to decide which Pot to prioritize.
REPORT_ENTRY_01=I organized this month's spending flow into numbers.
REPORT_ENTRY_02=Starting with the areas that changed the most makes them easier to manage.
REPORT_RANDOM_01=Do not look only at the total; check each category's share as well.
REPORT_RANDOM_02=A large expense on one day can affect the overall monthly trend.
REPORT_RANDOM_03=Comparing with last month makes this month's changes clearer.
REPORT_RANDOM_04=Looking at both amounts and percentages makes it easier to understand what changed.
REPORT_RANDOM_05=Try separating recurring expenses from one-time expenses.
REPORT_RANDOM_06=Checking your average daily spending can help you plan the rest of the month.
REPORT_RANDOM_07=See whether your spending tends to rise sharply near the end of the month.
REPORT_RANDOM_08=If there is little change, your current spending pattern may be relatively stable.
REPORT_RANDOM_09=Understanding why spending increased helps you plan next month more accurately.
REPORT_RANDOM_10=A report is most useful when it helps you decide what to do next.
MEMO_ENTRY_01=Your notes can help you remember why each expense happened.
MEMO_ENTRY_02=As your records build up, your spending patterns become clearer.
MEMO_RANDOM_01=Writing the store name and reason for spending together makes it easier to find later.
MEMO_RANDOM_02=A short note with the main reason is often enough.
MEMO_RANDOM_03=It is useful to note the reason for unexpected expenses.
MEMO_RANDOM_04=Repeated notes may point to a recurring spending habit.
MEMO_RANDOM_05=It can be helpful to review impulse purchases later.
MEMO_RANDOM_06=On days with special plans, adding the situation can make the note more useful.
MEMO_RANDOM_07=Even a short record can become useful evidence for future decisions.
MEMO_RANDOM_08=Grouping notes from the same store can make recurring expenses easier to spot.
MEMO_RANDOM_09=Reviewing your notes once a week can help you understand why you spent.
MEMO_RANDOM_10=A written line is usually more reliable than a memory that was never recorded.
CALCULATOR_ENTRY_01=Enter an amount and currencies, and I will calculate it using the current rate.
CALCULATOR_ENTRY_02=Checking the converted amount before paying can make budget management more accurate.
CALCULATOR_RANDOM_01=Exchange rates can change, so check again before making a large payment.
CALCULATOR_RANDOM_02=First, make sure the source and target currencies are in the right direction.
CALCULATOR_RANDOM_03=For larger amounts, even a small exchange-rate difference can affect the final amount.
CALCULATOR_RANDOM_04=You can also use an estimated converted amount when planning a travel budget.
CALCULATOR_RANDOM_05=Before setting a Pot target, it can help to calculate it in the local currency.
CALCULATOR_RANDOM_06=On weekends or holidays, the most recent business-day exchange rate may be used.
CALCULATOR_RANDOM_07=Small decimal differences can add up across repeated payments.
CALCULATOR_RANDOM_08=The result changes when the base currency changes, even for the same amount.
CALCULATOR_RANDOM_09=The actual charged amount may differ depending on the card issuer's rate timing or fees.
CALCULATOR_RANDOM_10=Use the calculation result as a reference before recording an expense.
