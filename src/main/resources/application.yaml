server:
  forward-headers-strategy: native

spring:
  application:
    name: uniconvert-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        globally_quoted_identifiers: true
  jackson:
    time-zone: Asia/Seoul
    serialization:
      write-dates-as-timestamps: false

oauth:
  google:
    client-id: ${GOOGLE_CLIENT_ID:dummy-google-client-id}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:3600000}
  refresh-token-expiration-ms: ${JWT_REFRESH_TOKEN_EXPIRATION_MS:1209600000}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger

ecos:
  api-key: ${ECOS_API_KEY}
  base-url: ${ECOS_BASE_URL:https://ecos.bok.or.kr/api}

aws:
  ses:
    access-key: ${AWS_ACCESS_KEY_ID}
    secret-key: ${AWS_SECRET_ACCESS_KEY}
    region: ${AWS_REGION:ap-northeast-2}
    from-address: ${AWS_SES_FROM_EMAIL}
