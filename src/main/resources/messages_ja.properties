# API error / validation i18n (I18N-08)
error.invalid_request=正しくないリクエストです。
error.validation_failed=入力値の検証に失敗しました。
error.unauthorized=認証が必要です。
error.forbidden=アクセス権限がありません。
error.not_found=要求されたリソースが見つかりません。
error.conflict=リクエストが現在の状態と競合しています。
error.token_invalid=トークンが無効です。
error.token_expired=トークンの有効期限が切れています。
error.login_invalid_credentials=パスワードが正しくありません。パスワードを再設定してください。
error.login_password_failure_limit=パスワードが連続して一致しません。アカウントを確認するか、もう一度会員登録を行ってください。
error.email_already_registered=このメールアドレスはすでに登録されています。ログインしてください。
error.internal_server_error=サーバー内部エラーが発生しました。
error.budget_not_found=該当月の予算が見つかりません。
error.expense_not_found=支出履歴が見つかりません。
error.invalid_category=有効なカテゴリではありません。
error.empty_file=アップロードしたファイルが空です。
error.invalid_csv_format=対応していないCSV形式です。（WiseまたはMonzoの明細のみ対応しています）
error.unsupported_currency=対応していない通貨です。（USD・EUR・JPY・CNYのみ対応しています）

